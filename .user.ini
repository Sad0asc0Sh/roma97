; Roma Daycare - PHP runtime settings for large file uploads
upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; ── Nov 2026 PHP security hardening (CVE-2026-115560 / CVE-2026-129496) ──
; PHP 8.2.36+ turns upload progress OFF by default; keep it explicitly
; off as defense in depth (also covers a rebuild from an older base).
; Upload progress is not used anywhere in roma97.
session.upload_progress.enabled = 0
; A valid date.timezone removes the startup-warning trigger for the
; timezone-cache use-after-free (CVE-2026-129496). App also sets it at runtime.
date.timezone = "Asia/Tehran"
