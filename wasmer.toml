[package]
entrypoint = "run"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"
[command.annotations.wasi]
main-args = [
    "-t",
    "/app",
    "-S",
    "localhost:8080",
    "-d",
    "memory_limit=256M",
    "-d",
    "max_execution_time=120",
    "-d",
    "max_input_time=120",
    "-d",
    "max_input_vars=4096",
    "-d",
    "upload_max_filesize=20M",
    "-d",
    "post_max_size=25M"
]
