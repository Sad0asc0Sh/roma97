<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <!-- Bargoo - Roma Kindergarten Mascot Guide -->

  <!-- Bargoo Happy (Default) -->
  <g id="bargoo-happy" viewBox="0 0 100 100">
    <!-- Leaf Body -->
    <path d="M50,5 C75,5 92,30 90,60 C88,85 68,95 50,95 C32,95 12,85 10,60 C8,30 25,5 50,5 Z" fill="#3D8B63"/>
    <path d="M50,15 Q55,45 50,85" stroke="#2E6B4C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="32" cy="56" r="6" fill="#C4724A" opacity="0.4"/>
    <circle cx="68" cy="56" r="6" fill="#C4724A" opacity="0.4"/>
    <!-- Eyes (Happy Arcs) -->
    <path d="M30,48 Q35,42 40,48" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M60,48 Q65,42 70,48" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Big Smile -->
    <path d="M38,60 Q50,72 62,60" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Tiny Stem -->
    <path d="M50,5 C48,-2 52,-5 54,-3" stroke="#2E6B4C" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bargoo Sleeping (Empty states / Loading) -->
  <g id="bargoo-sleeping" viewBox="0 0 100 100">
    <path d="M50,5 C75,5 92,30 90,60 C88,85 68,95 50,95 C32,95 12,85 10,60 C8,30 25,5 50,5 Z" fill="#3D8B63"/>
    <path d="M50,15 Q55,45 50,85" stroke="#2E6B4C" stroke-width="2" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="32" cy="56" r="7" fill="#E8A838" opacity="0.4"/>
    <circle cx="68" cy="56" r="7" fill="#E8A838" opacity="0.4"/>
    <!-- Closed Eyes (sleeping) -->
    <path d="M30,48 Q35,53 40,48" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M60,48 Q65,53 70,48" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Soft Smile -->
    <path d="M42,62 Q50,67 58,62" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Floating Zzz -->
    <text x="72" y="30" fill="#E8A838" font-family="sans-serif" font-weight="bold" font-size="14">z</text>
    <text x="82" y="20" fill="#E8A838" font-family="sans-serif" font-weight="bold" font-size="11">z</text>
  </g>

  <!-- Bargoo Surprised (404 / Not Found) -->
  <g id="bargoo-surprised" viewBox="0 0 100 100">
    <path d="M50,5 C75,5 92,30 90,60 C88,85 68,95 50,95 C32,95 12,85 10,60 C8,30 25,5 50,5 Z" fill="#3D8B63"/>
    <path d="M50,15 Q55,45 50,85" stroke="#2E6B4C" stroke-width="2" fill="none"/>
    <circle cx="30" cy="55" r="5" fill="#C4724A" opacity="0.4"/>
    <circle cx="70" cy="55" r="5" fill="#C4724A" opacity="0.4"/>
    <!-- Wide Open Eyes -->
    <circle cx="36" cy="46" r="6" fill="#FFFFFF"/>
    <circle cx="36" cy="46" r="3" fill="#1F3B32"/>
    <circle cx="64" cy="46" r="6" fill="#FFFFFF"/>
    <circle cx="64" cy="46" r="3" fill="#1F3B32"/>
    <!-- 'O' Mouth -->
    <circle cx="50" cy="64" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Bargoo Waving (Form Success / Welcome) -->
  <g id="bargoo-waving" viewBox="0 0 100 100">
    <!-- Waving Arm/Leaf -->
    <path d="M78,45 Q94,30 88,20 C82,15 74,32 72,40 Z" fill="#3D8B63"/>
    <path d="M50,5 C75,5 92,30 90,60 C88,85 68,95 50,95 C32,95 12,85 10,60 C8,30 25,5 50,5 Z" fill="#3D8B63"/>
    <path d="M50,15 Q55,45 50,85" stroke="#2E6B4C" stroke-width="2" fill="none"/>
    <circle cx="32" cy="56" r="6" fill="#C4724A" opacity="0.4"/>
    <circle cx="68" cy="56" r="6" fill="#C4724A" opacity="0.4"/>
    <!-- Sparkle Eyes -->
    <circle cx="35" cy="46" r="4" fill="#FFFFFF"/>
    <circle cx="65" cy="46" r="4" fill="#FFFFFF"/>
    <!-- Big Laughing Mouth -->
    <path d="M36,58 Q50,75 64,58 Z" fill="#FFFFFF"/>
  </g>
</svg>